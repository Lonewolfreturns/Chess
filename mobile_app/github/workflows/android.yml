# Builds the Android app (.apk) in the cloud, then starts it on an Android emulator as a check.
#
# The phone-ready code lives in mobile_app/. The build steps themselves are in
# mobile_app/github/scripts/build_apk.sh, so fixes to the build only touch mobile_app/.
#
# Runs when anything in mobile_app/ changes on main, or by hand from the Actions tab
# ("Android build" -> "Run workflow"). The finished APKs are attached to the run as artifacts:
#   WizardWarChess-aarch64-apk  -> install this one on your phone
#   WizardWarChess-x86_64-apk   -> for the Android emulator
#   emulator-check              -> screenshots and logs from the emulator run
name: Android build

on:
  push:
    branches: [main]
    paths:
      - "mobile_app/**"
      - "!mobile_app/**.md"
      - ".github/workflows/android.yml"
  workflow_dispatch:

env:
  PYSIDE_VERSION: "6.12.0"

jobs:
  apk:
    name: APK (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mobile_app     # skip the big dist/ folder of Windows builds

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android SDK/NDK, wheels and build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.pyside6_android_deploy
            ~/.buildozer
            ~/wheels
          key: android-${{ matrix.arch }}-pyside${{ env.PYSIDE_VERSION }}-v2

      - name: Build the APK
        run: bash github/scripts/build_apk.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: WizardWarChess-${{ matrix.arch }}-apk
          path: mobile_app/apk_out/*.apk
          if-no-files-found: error

  emulator-check:
    name: Start on Android emulator
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mobile_app/github

      - uses: actions/download-artifact@v4
        with:
          name: WizardWarChess-x86_64-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile_app/github/scripts/emulator_check.sh apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-check
          path: emu_out
