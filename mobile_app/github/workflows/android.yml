# Builds the Android app (.apk) in the cloud, then starts it on an Android emulator as a check.
#
# Runs on every push to the mobile-app branch, or by hand from the repo's Actions tab
# ("Android build" -> "Run workflow"). The finished APKs are attached to the run as artifacts:
#   WizardWarChess-aarch64-apk  -> install this one on your phone
#   WizardWarChess-x86_64-apk   -> for the Android emulator
#   emulator-check              -> screenshots and logs from the emulator run
name: Android build

on:
  push:
    branches: [mobile-app]
    paths-ignore: ["**.md"]
  workflow_dispatch:

env:
  PYSIDE_VERSION: "6.12.0"

jobs:
  apk:
    name: APK (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages for python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ccache git zip unzip patch \
            autoconf automake libtool libtool-bin libltdl-dev pkg-config cmake lld \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev libsqlite3-dev libbz2-dev liblzma-dev

      - name: Cache Android SDK/NDK and build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.pyside6_android_deploy
            ~/.buildozer
          key: android-${{ matrix.arch }}-pyside${{ env.PYSIDE_VERSION }}-v1

      - name: Qt for Python (host) and deploy tool
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6==${PYSIDE_VERSION}" jinja2 pkginfo tqdm "packaging==24.1" "markupsafe" \
            "buildozer==1.6.0" "cython==0.29.33" setuptools wheel

      - name: Android SDK and NDK (Qt's download script)
        run: |
          if [ ! -d ~/.pyside6_android_deploy/android-sdk/platform-tools ] || \
             ! ls -d ~/.pyside6_android_deploy/android-ndk/android-ndk-r* >/dev/null 2>&1; then
            git clone --depth 1 --branch "${PYSIDE_VERSION}" https://github.com/qtproject/pyside-pyside-setup.git /tmp/pyside-setup
            cd /tmp/pyside-setup
            python tools/cross_compile_android/main.py --download-only --skip-update --auto-accept-license \
              --plat-name ${{ matrix.arch }}
          fi
          SDK=~/.pyside6_android_deploy/android-sdk
          yes | "$SDK/cmdline-tools/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          ls ~/.pyside6_android_deploy ~/.pyside6_android_deploy/android-sdk

      - name: PySide6 Android wheels
        run: |
          mkdir -p ~/wheels
          base=https://download.qt.io/official_releases/QtForPython
          for pkg in pyside6 shiboken6; do
            name=$(curl -fsSL "$base/$pkg/" | grep -oiE "${pkg}-${PYSIDE_VERSION//./\\.}-${PYSIDE_VERSION//./\\.}-[a-z0-9_]+-android_${{ matrix.arch }}\.whl" | head -1)
            echo "$pkg -> $name"
            test -n "$name"
            curl -fL --retry 3 -o ~/wheels/"$name" "$base/$pkg/$name"
          done
          ls -la ~/wheels

      - name: Build the APK
        run: |
          rm -rf dist build buildozer.spec .buildozer deployment
          pyside6-android-deploy -f -v \
            --wheel-pyside "$(ls ~/wheels/pyside6-*.whl ~/wheels/PySide6-*.whl 2>/dev/null | head -1)" \
            --wheel-shiboken "$(ls ~/wheels/shiboken6-*.whl 2>/dev/null | head -1)" \
            --extra-ignore-dirs tests,build_assets,chess
          ls -la *.apk || find . -name "*.apk" -not -path "./.buildozer/*"

      - name: Show generated build settings
        if: always()
        run: |
          cat pysidedeploy.spec || true
          grep -E "^(requirements|android\.|p4a\.|source\.)" buildozer.spec || true

      - uses: actions/upload-artifact@v4
        with:
          name: WizardWarChess-${{ matrix.arch }}-apk
          path: "*.apk"
          if-no-files-found: error

  emulator-check:
    name: Start on Android emulator
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: WizardWarChess-x86_64-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator_check.sh apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-check
          path: emu_out
